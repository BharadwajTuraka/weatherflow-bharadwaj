api:
  forecast_url: https://api.open-meteo.com/v1/forecast
  archive_url: https://archive-api.open-meteo.com/v1/archive
  timeout_seconds: 10
  max_retries: 3
  hourly_variables:
    - temperature_2m
    - relative_humidity_2m
    - apparent_temperature
    - precipitation
    - wind_speed_10m
    - weather_code
    - is_day
  timezone: UTC
cities:
  - {name: London,     country: United Kingdom, latitude: 51.5085, longitude: -0.1257}
  - {name: Manchester, country: United Kingdom, latitude: 53.4809, longitude: -2.2374}
  - {name: Birmingham, country: United Kingdom, latitude: 52.4814, longitude: -1.8998}
  - {name: Edinburgh,  country: United Kingdom, latitude: 55.9521, longitude: -3.1965}
  - {name: Cardiff,    country: United Kingdom, latitude: 51.4802, longitude: -3.1792}
dim_date:
  start: "2025-01-01"
  end: "2027-12-31"
paths:
  raw_dir: data/raw
  processed_dir: data/processed
  quarantine_dir: data/quarantine
  database: data/weather.db
  wmo_codes: src/weatherflow/reference/wmo_codes.csv
  schema_sql: sql/schema.sql